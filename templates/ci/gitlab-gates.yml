# S12:在 MR 上獨立重跑腳本關卡。這是唯一不在 AI 手裡的執行環境。
#
# include 進 <repo>/.gitlab-ci.yml。**裝進專案是人的決定** —— pipeline 不會自動做。
# 只跑不需要 toolchain 的關卡;G3/G4/smoke 要專案自己補 job。
gates:
  stage: test
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pip install pyyaml
    - git clone --depth 1 https://github.com/Chiao75543/claude-workflow.git /tmp/cw
    - |
      status=0
      for spec in specs/*/spec.yaml; do
        [ -f "$spec" ] || continue
        echo "## $spec"
        /tmp/cw/scripts/gates/spec-lint "$spec"        || status=1
        /tmp/cw/scripts/gates/freeze-check "$spec"     || status=1
        /tmp/cw/scripts/gates/spec-diff "$spec"        || status=1
        /tmp/cw/scripts/gates/traceability "$spec"     || status=1
        /tmp/cw/scripts/gates/test-review "$spec" --mechanical-only || status=1
      done | tee gates.log
      exit $status
  artifacts:
    when: always
    paths: [gates.log]
