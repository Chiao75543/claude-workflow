            out: {status: rejected, reason: invalid_status_schema, written: false, exit_code: 2}
          - in: {expect_generation: 1, pipeline_state: waiting, delivery_state: pr_open, delivery_ref: null}
            out: {status: rejected, reason: invalid_status_schema, written: false, exit_code: 2}

      - id: SC-048
        mode: 6b
        given: {stored_generation: 6, expected_generation: 5}
        when: set_status
        then: {status: conflict, expected_generation: 5, actual_generation: 6, written: false, exit_code: 1}
