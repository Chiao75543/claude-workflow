  - id: REQ-005
    statement: Pipeline SHALL 讓 mode 6b 使用可稽核的非 Swift static command 擷取 true RED
    completeness:
      empty_boundary: [SC-016]
      error_path: [SC-017, SC-018, SC-019, SC-033, SC-034, SC-054, SC-055]
      concurrency: "N/A — static checks 依序執行並各自產生獨立 log"
      illegal_state: [SC-017, SC-018, SC-019, SC-033, SC-034, SC-054, SC-055]
      authorization: "N/A — 只執行 repository red-inputs 明列的 argv，不使用 shell"
      data_migration: "N/A — 未指定 per-entry runner 的既有 Swift 證據格式維持不變"
    scenarios:
      - id: SC-016
        mode: 6b
        given: {runner: static-command, exit_code: 1, marker: STATIC_ASSERTION}
        when: capture_red
        then: {failure_class: assertion, red_valid: true, gate_exit_code: 0}
        examples:
          - in: {argv: [python3, checker.py], exit_code: 1, output: "STATIC_ASSERTION: expected blocked"}
            out: {failure_class: assertion, red_valid: true, gate_exit_code: 0}

      - id: SC-017
        mode: 6b
        given: {runner: static-command, exit_code: 0}
        when: capture_red
        then: {failure_class: passed, red_valid: false, gate_exit_code: 1}
        examples:
          - in: {argv: [python3, checker.py], exit_code: 0}
            out: {failure_class: passed, red_valid: false, gate_exit_code: 1}

      - id: SC-018
        mode: 6b
        given: {runner: static-command, exit_code: 2}
        when: capture_red
        then: {failure_class: error, red_valid: false, gate_exit_code: 1}
        examples:
          - in: {argv: [python3, checker.py], exit_code: 2}
            out: {failure_class: error, red_valid: false, gate_exit_code: 1}

      - id: SC-019
        mode: 6b
        given: {runner: static-command, approved_examples: 2, declared_checks: 1}
        when: capture_red
        then: {status: failed, reason: missing_example_check, gate_exit_code: 1}
        examples:
          - in: {approved_examples: [1, 2], checked_examples: [1]}
            out: {status: failed, reason: missing_example_check, gate_exit_code: 1}

      - id: SC-020
        mode: 6b
        given: {runner: swift_testing, per_entry_override: absent}
        when: capture_red
        then: {legacy_parser_used: true, behavior_preserved: true, gate_exit_code: 0}
        examples:
          - in: {pipeline_runner: swift_testing, entry_runner: null}
            out: {legacy_parser_used: true, behavior_preserved: true, gate_exit_code: 0}

      - id: SC-033
        mode: 6b
        given: {runner: static-command, command_state: timeout}
        when: capture_red
        then: {failure_class: hang, red_valid: false, gate_exit_code: 1}
        examples:
          - in: {argv: [python3, checker.py], timeout_seconds: 1, timed_out: true}
            out: {failure_class: hang, red_valid: false, gate_exit_code: 1}

      - id: SC-034
        mode: 6b
        given: {runner: static-command, checks: missing_duplicate_or_unknown_scenario}
        when: capture_red
        then: {status: rejected, reason: invalid_static_schema, gate_exit_code: 2}
        examples:
          - in: {argv: [], timeout_seconds: 30, checks: []}
            out: {status: rejected, reason: invalid_static_schema, gate_exit_code: 2}
          - in: {approved_examples: [1, 2], checked_examples: [1, 1]}
            out: {status: rejected, reason: invalid_static_schema, gate_exit_code: 2}
          - in: {approved_scenarios: [SC-016], checked_scenarios: [SC-999]}
            out: {status: rejected, reason: invalid_static_schema, gate_exit_code: 2}
          - in: {approved_examples: [1], checked_examples: [0]}
            out: {status: rejected, reason: invalid_static_schema, gate_exit_code: 2}

      - id: SC-035
        mode: 6b
        red_exempt_reason: 既有 test-review、traceability 與 freeze-check 已能證明此相容性基準；本變更不得刻意破壞後再修回
        given: {runner: static-command, checker_and_dependencies: reviewed_traced_and_frozen}
        when: verify_static_contract
        then: {test_review: passed, traceability: passed, tests_hash_current: true, exit_code: 0}
        examples:
          - in: {tests: [checker.py, policy.json], checks: [{scenario: SC-016, examples: [1]}]}
            out: {test_review: passed, traceability: passed, tests_hash_current: true, exit_code: 0}

      - id: SC-054
        mode: 6b
        given: {runner: static-command, exit_code: 1, marker: malformed_or_absent}
        when: capture_red
        then: {failure_class: error, red_valid: false, gate_exit_code: 1}
        examples:
          - in: {argv: [python3, checker.py], exit_code: 1, output: "prefix STATIC_ASSERTION: not-at-line-start"}
            out: {failure_class: error, red_valid: false, gate_exit_code: 1}
          - in: {argv: [python3, checker.py], exit_code: 1, output: "static_assertion: wrong-case"}
            out: {failure_class: error, red_valid: false, gate_exit_code: 1}

      - id: SC-055
        mode: 6b
        given: {runner: static-command, repo_dependency: undeclared}
        when: verify_static_contract
        then: {status: rejected, reason: undeclared_static_dependency, gate_exit_code: 1}
        examples:
          - in: {argv: [python3, checker.py], tests: [checker.py], fixture_manifest_imports: [policy.json]}
            out: {status: rejected, reason: undeclared_static_dependency, gate_exit_code: 1}

  - id: REQ-006
    statement: Pipeline SHALL 沿用既有 finding 身分與收斂計數且只在當前反證成立時重開
    completeness:
      empty_boundary: [SC-036]
      error_path: [SC-037, SC-038, SC-045, SC-049]
      concurrency: "N/A — finding ledger 由現有 loop 對單一 spec 依序更新"
      illegal_state: [SC-037, SC-044, SC-045, SC-049]
      authorization: "N/A — 不改 MAX_FIXES、finding 類別或 owner decided 邊界"
      data_migration: "N/A — 沿用既有 finding ID 與 history，不建立新版平行 ledger"
    scenarios:
      - id: SC-036
        mode: 6b
        given: {finding_status: fixed, inputs_hash: unchanged, repro_result: passing}
        when: plan_revalidation
        then: {finding_status: fixed, action: preserve, fixes: 1, exit_code: 0}
        examples:
          - in: {id: F-7, fixture_ledger_status: fixed, fixture_fixes: 1, fixture_repro_exit: 0}
            out: {id: F-7, status: fixed, action: preserve, fixes: 1, exit_code: 0}

      - id: SC-037
        mode: 6b
        given: {finding_status: fixed, current_version_repro: failing}
        when: plan_revalidation
        then: {finding_id_reused: true, action: reappear, result: flipflop, fixes: 1, exit_code: 1}
        examples:
          - in: {id: F-7, fixture_ledger_status: fixed, fixture_fixes: 1, fixture_repro_exit: 1}
            out: {id: F-7, finding_id_reused: true, action: reappear, result: flipflop, fixes: 1, exit_code: 1}

      - id: SC-038
        mode: 6b
        given: {affected_scope: cannot_be_bounded}
        when: plan_revalidation
        then: {required_action: full_rerun, gates: [G0-G7, smoke, G9, G10], may_claim_pass: false, exit_code: 1}
        examples:
          - in: {changed_files: [scripts/gates/_common.py], dependency_map: unknown}
            out: {required_action: full_rerun, gates: [G0-G7, smoke, G9, G10], may_claim_pass: false, exit_code: 1}

      - id: SC-044
        mode: 6b
        given: {existing_finding: F-7, same_identity: true, title_or_requested_id_changed: true}
        when: add_finding
        then: {status: rejected, canonical_id: F-7, fixes_preserved: true, exit_code: 1}
        examples:
          - in: {requested_id: F-99, canonical_id: F-7, identity_same: true, title_changed: true}
            out: {status: rejected, canonical_id: F-7, fixes_preserved: true, exit_code: 1}

      - id: SC-045
        mode: 6b
        given: {loop_limit_or_redispatch_limit: reached}
        when: advance_review_loop
        then: {status: blocked, owner_decision_required: true, exit_code: 1}
        examples:
          - in: {id: F-7, fixes: 2, requested_action: fix}
            out: {id: F-7, status: parked, fixes: 2, owner_decision_required: true, exit_code: 1}
          - in: {gate: G10, prior_redispatches: 1, requested_action: redispatch}
            out: {gate: G10, status: blocked, prior_redispatches: 1, owner_decision_required: true, exit_code: 1}

      - id: SC-049
        mode: 6b
        given: {requested_id: existing, canonical_identity: different}
        when: add_finding
        then: {status: rejected, reason: finding_id_conflict, existing_finding_preserved: true, exit_code: 1}
        examples:
          - in: {requested_id: F-7, fixture_existing_identity: identity_a, fixture_requested_identity: identity_b}
            out: {status: rejected, reason: finding_id_conflict, existing_finding_preserved: true, exit_code: 1}

  - id: REQ-007
    statement: Pipeline SHALL 在不使用 Simulator 的暫存 Git repository 證明完整 autonomy 交付序列
