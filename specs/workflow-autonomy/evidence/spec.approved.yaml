                - "scripts/gates/autonomy specs/workflow-autonomy/spec.yaml check"
                - "scripts/gates/red-capture specs/workflow-autonomy/spec.yaml"
                - "scripts/gates/test-review specs/workflow-autonomy/spec.yaml"
