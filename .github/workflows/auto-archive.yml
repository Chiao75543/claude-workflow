name: auto-archive

# Stage 12 of the workflow-orchestrator pipeline.
#
# When a PR is merged, this workflow:
#   1. Identifies the single openspec/changes/{name}/ folder the PR touched
#   2. Runs scripts/archive.sh {name} on the merged tip of the base branch
#   3. Commits + pushes the archive move + specs/ merge directly to that branch
#
# Branch protection must allow this workflow's identity to push. Set repo
# secret ARCHIVE_BOT_TOKEN to a PAT / GitHub App token that bypasses required
# reviews; otherwise it falls back to GITHUB_TOKEN (works only if protection
# is configured to allow Actions to push).

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (post-merge tip)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.ARCHIVE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Detect change name from PR diff
        id: detect
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          mapfile -t names < <(
            git diff --name-only "${BASE_SHA}" "${MERGE_SHA}" \
              | awk -F/ '$1=="openspec" && $2=="changes" && $3!="archive" {print $3}' \
              | sort -u
          )

          if [ "${#names[@]}" -eq 0 ]; then
            echo "::notice::No openspec/changes/{name}/ paths in PR — nothing to archive"
            echo "name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#names[@]}" -gt 1 ]; then
            echo "::warning::PR touches multiple changes: ${names[*]}. Skipping; run scripts/archive.sh manually."
            echo "name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected change: ${names[0]}"
          echo "name=${names[0]}" >> "$GITHUB_OUTPUT"

      - name: Run archive script
        if: steps.detect.outputs.name != ''
        run: bash scripts/archive.sh "${{ steps.detect.outputs.name }}"

      - name: Commit + push
        if: steps.detect.outputs.name != ''
        env:
          NAME: ${{ steps.detect.outputs.name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "::notice::archive.sh produced no changes — already archived?"
            exit 0
          fi
          git config user.name  "auto-archive-bot"
          git config user.email "auto-archive-bot@users.noreply.github.com"
          git add openspec/
          git commit -m "chore(archive): ${NAME} (Stage 12, auto)"
          git push origin "HEAD:${BASE_REF}"
